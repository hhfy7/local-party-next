server {
    listen 80;
    
    # 开启 gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 根路径重定向 (可选)
    location = / {
        return 301 /local-party/;
    }

    # Serve 静态文件
    location /local-party/ {
        alias /usr/share/nginx/html/local-party/;
        index index.html;
        try_files $uri $uri/ /local-party/index.html;
    }
}