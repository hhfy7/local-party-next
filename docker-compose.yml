version: '3.8'

services:
  local-party-backend:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    image: local-party-backend:${TAG:-latest}
    container_name: lp-backend
    restart: always
    environment:
      - PORT=4000
      - CORS_ORIGIN=*
    ports:
      - '4000:4000'
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M

  local-party-frontend:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
      args:
        GIT_COMMIT_HASH: ${GIT_COMMIT_HASH:-unknown}
        GIT_COMMIT_MESSAGE: ${GIT_COMMIT_MESSAGE:-unknown}
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
        GIT_HAS_CHANGES: ${GIT_HAS_CHANGES:-false}
    image: local-party-frontend:${TAG:-latest}
    container_name: lp-frontend
    restart: always
    ports:
      - '3000:80'
    depends_on:
      - local-party-backend
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 32M
